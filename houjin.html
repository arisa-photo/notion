<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>法人・チーム向け Notion構築代行｜準備中</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1a1a1a;--navy-deep:#141414;--accent:#8199b9;--accent-strong:#5f7ea3;
    --gray-500:#8c8c88;--gray-700:#3a3a38;--line:#e6e6e3;
    --font-serif:"Shippori Mincho",serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,-apple-system,sans-serif;
    color:var(--gray-700);background:#fff;line-height:1.9;letter-spacing:0.03em;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:40px 24px;-webkit-font-smoothing:antialiased;
  }
  .eyebrow{font-size:12px;font-weight:600;letter-spacing:0.24em;color:var(--accent-strong);margin-bottom:22px;}
  h1{font-family:var(--font-serif);color:var(--navy-deep);font-weight:600;letter-spacing:0.07em;
     font-size:clamp(22px,4vw,30px);line-height:1.6;margin-bottom:20px;}
  p{font-size:14.5px;color:var(--gray-500);max-width:560px;margin:0 auto 14px;}
  .back{display:inline-flex;align-items:center;gap:8px;margin-top:28px;
        padding:14px 32px;border:1px solid var(--ink);color:var(--ink);
        font-size:14px;font-weight:600;letter-spacing:0.08em;border-radius:2px;
        text-decoration:none;transition:background .2s,color .2s;}
  .back:hover{background:var(--ink);color:#fff;}
  .rule{width:40px;height:1px;background:var(--line);margin:30px auto;}
</style>
</head>
<body>
  <div class="eyebrow">FOR BUSINESS</div>
  <h1>法人・チーム向けページは<br>ただいま準備中です</h1>
  <p>社内ダッシュボード・権限設計・複数名での運用など、法人・チーム向けの導入ページを準備しています。</p>
  <p>お急ぎの場合は、フリーランス向けページのLINEから「法人での相談」とお伝えください。内容を伺った上で、別途お見積りいたします。</p>
  <div class="rule"></div>
  <a class="back" href="index.html">← フリーランス向けページへ戻る</a>
</body>
</html>
